name: CI & Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # 发布前置门禁 (单一事实来源): 直接复用 ci.yml 的全套三路检查 (verify / verify-windows /
  # conformance), 既确保 main 推送零双跑、不白烧双倍 macOS runner, 又把 Windows 兼容正式纳入发版硬门禁。
  checks:
    uses: ./.github/workflows/ci.yml

  # 人工批准闸门 (environment: release, 配 required reviewers): 批准后才进入发布。
  # concurrency 放在 release job 级 (而非顶层): 既保证实际发布严格串行不并发冲突,
  # 又避免前一次待审批的 waiting run 把后续 main 推送的 checks 三平台 CI 卡死在 pending。
  # OIDC 发布: 不设任何 npm token; id-token: write 供 Trusted Publishing 换取短寿命凭据。
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # 打 tag / push 版本提交 / 建 GitHub Release
      issues: write # release 评论
      pull-requests: write # release 评论
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release 需要全历史与全部 tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # 自带 npm 11.x: OIDC 与 provenance 所需
          # 不设 registry-url: 它会生成带 NODE_AUTH_TOKEN 的 .npmrc, 压掉 OIDC 通道
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # 发布凭据预检 (发布特有, 经 ci.ts 单源调用): OIDC 换证即与 npm 侧 Trusted Publisher
      # 登记的全量核对 (含 environment 声明), 失配在发布前当场点名。必须放本 job: environment
      # 声明来自 job 的 environment, 无 environment 的 job 换证会被 npm 以误导性的 404 拒绝
      - run: bun run ci -- --only npm-trust
      - name: Release (multi-semantic-release, OIDC)
        run: bunx --no-install multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm 命令 (semrel prepare 的 npm version) 在 workspace 子包内运行, 会尝试生成
          # package-lock.json 而弄脏发布闸门的「工作树干净」判定; env 通道优先于一切配置文件
          npm_config_package_lock: 'false'
