name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      # build 先于 test: 发行面白名单用例需要 dist 在场才会执行 (缺席为设计内 skip)
      - name: Build
        run: bunx turbo run build
      - name: Typecheck
        run: bunx turbo run typecheck
      - name: Test
        run: bunx turbo run test
      - name: Lint
        run: bunx oxlint
      - name: Format check
        run: bunx prettier --check .
      - name: Doc references
        run: bun run lint:refs
      - name: Doc examples
        run: bun run lint:examples
      - name: Corpus ledger
        run: bun run lint:coverage

  # 转写验收 (逐字节金样本) 的语料为 macOS 文件系统口径录制 (du 磁盘占用含块分配差异:
  # 同一 fixture 在 APFS 计 8 KB, 在 ext4 因目录节点再计 4 KB → 12 KB), 故在 macOS runner
  # 执行, 与语料录制环境同源; 它长期以来的运行环境即 macOS (手动双跑)。
  conformance:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # node target 直跑 CLI 源码时按 exports 解析 @iyowei/sweep-node-modules → dist;
      # node 不读 tsconfig paths (bun 独有), 故 dist 必须先行构建 (bun target 无此需要)
      - name: Build
        run: bunx turbo run build
      - name: Conformance (bun)
        run: bun scripts/transcription/run-conformance.ts --target "bun packages/sweep-node-modules-cli/src/cli.ts" --api-target "bun scripts/transcription/api-harness.ts"
      - name: Conformance (node)
        run: bun scripts/transcription/run-conformance.ts --target "node packages/sweep-node-modules-cli/src/cli.ts" --api-target "node scripts/transcription/api-harness.ts"
