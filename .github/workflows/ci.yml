name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  # 按事件名隔离并发组: PR 连续推送自动取消旧跑; 由 release.yml (push main) 经 workflow_call
  # 复用时, 组名与 release.yml 中 release job 的 group: release 互不重叠, 且不中途取消发布检查。
  group: ci-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      # 验证组 (步骤集合的单一事实来源在 scripts/ci.ts, 与本地全链 / Release 前置门禁同集合)
      - name: Verify (ci.ts --verify)
        run: bun run ci -- --verify

  # Windows OS 兼容专项 (路径分隔符 / 启动器 / 双运行时 / 文件系统语义):
  # 不重跑 OS 无关的 typecheck 与静态 lint, 也不在 4 核 VM 并发重跑已在 Linux 验证过的
  # npm pack 白名单; 经 scripts/ci.ts --verify-windows 统一收口并限并发。
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:RUNNER_TEMP", "$env:USERPROFILE\.bun"
          } catch {
            Write-Host "Skip Defender exclusion: $_"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify Windows (ci.ts --verify-windows)
        run: bun run ci -- --verify-windows

  # macOS OS 兼容专项 (真实全量测试 + 启动器/产物验证 + 跨包管理器装包冒烟):
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify macOS (ci.ts --verify-macos)
        run: bun run ci -- --verify-macos

  # 转写验收 (逐字节金样本) 的语料为 macOS 文件系统口径录制 (du 磁盘占用含块分配差异:
  # 同一 fixture 在 APFS 计 8 KB, 在 ext4 因目录节点再计 4 KB → 12 KB), 故在 macOS runner
  # 执行, 与语料录制环境同源。
  conformance:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      # 验收组 (含 build: node target 需 dist 前置, 理由见 scripts/ci.ts 的组注释)
      - name: Conformance (ci.ts --conformance)
        run: bun run ci -- --conformance
