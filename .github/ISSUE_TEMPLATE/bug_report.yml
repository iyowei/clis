name: Bug report
description: Report a problem with any CLI or programmable API package in iyowei/clis.
title: "[Bug]:\x20"
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much as you can; a precise reproduction gets a fix faster.

        For security problems, do not open a public issue. Report it privately through the Security tab (Report a vulnerability). See [SECURITY.md](https://github.com/iyowei/clis/blob/main/SECURITY.md) for the full policy.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched the existing issues and did not find this report.
          required: true
        - label: I can reproduce this on the latest published version, or on the current main branch from a clone.
          required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - create-clis
        - '@iyowei/sweep-cli (sweep)'
        - '@iyowei/sweep (API)'
        - '@iyowei/codd-cli (codd)'
        - '@iyowei/codd (API)'
        - '@iyowei/fan-cli (fan)'
        - '@iyowei/fan (API)'
        - Repository infrastructure / docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in use (for example 1.0.0), or the commit hash when running from a clone.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      description: The runtime the run actually used (bun or node) and its version.
      placeholder: 'bun 1.4.5 / node 24.7.0'
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How the package is run
      options:
        - bunx / bun create (no install)
        - npx (no install)
        - Installed globally as CLI command
        - Imported as programmable API dependency
        - From a clone of the repository
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or API calls used, plus any relevant configuration file (redact secrets).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened, including the full output and error code if present.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Optional. Related issues, screenshots, or any other context that might help.
