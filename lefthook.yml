# Git 钩子门禁 (lefthook)
#
# 分层策略:
#   pre-commit 增量门禁: prettier / oxlint 只扫暂存文件; type-check 例外,
#               不传 {staged_files}, 跑全项目 typecheck (覆盖各包与根 scripts/);
#               prettier 格式化后自动重暂存
#   pre-push   全量门禁: rebase / merge / cherry-pick 重放提交不触发 pre-commit,
#               push 是代码外流的唯一必经闸门, 在此全量只读兜底

lefthook: bunx lefthook@2.1.14
assert_lefthook_installed: true

pre-commit:
  parallel: false
  commands:
    # TypeScript 类型检查 (全仓包 + 根 scripts/, 单源复用根 package.json typecheck)
    type-check:
      glob: '*.{ts,tsx,mts,mjs,js,cjs}'
      run: bun run typecheck

    # JS/TS (含 .mts / .mjs / .js / .cjs): prettier 格式化后自动重暂存, 再 oxlint
    prettier-js:
      glob: '*.{ts,tsx,mts,mjs,js,cjs}'
      run: bunx prettier --write --log-level error {staged_files}
      stage_fixed: true

    oxlint:
      glob: '*.{ts,tsx,mts,mjs,js,cjs}'
      run: bunx oxlint {staged_files}

    # 非 JS/TS: 仅 prettier 格式化
    prettier-other:
      glob: '*.{md,mdx,json,jsonc,yaml,yml}'
      run: bunx prettier --write --log-level error {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    # 全量预演 (验证组 + 验收组): 步骤集合的单一事实来源在 scripts/ci.ts
    ci:
      run: bun run ci
