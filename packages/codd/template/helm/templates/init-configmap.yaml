apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-init-script" (include "mongo.fullname" .) | quote }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail

    HOST_0="${MONGO_POD_PREFIX}-0.${MONGO_HEADLESS_SVC}.${MONGO_NAMESPACE}.svc.cluster.local"
    echo ">>> [Init] 目标主引导节点: ${HOST_0}:${MONGO_PORT}, 副本数: ${MONGO_REPLICA_COUNT}"

    # 1) 等待全部 StatefulSet Pod 在各自 headless FQDN 就绪 (最多等 5 分钟)
    for ((i = 0; i < MONGO_REPLICA_COUNT; i++)); do
      target="${MONGO_POD_PREFIX}-${i}.${MONGO_HEADLESS_SVC}.${MONGO_NAMESPACE}.svc.cluster.local"
      ok=0
      for _ in $(seq 1 150); do
        if MONGOSH_NO_TERMINAL_USAGE=1 mongosh --quiet --norc \
          "mongodb://${target}:${MONGO_PORT}/admin?directConnection=true" \
          --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
          ok=1
          break
        fi
        sleep 2
      done
      if [ "$ok" -ne 1 ]; then
        echo "错误: Pod ${target}:${MONGO_PORT} 响应超时"
        exit 1
      fi
      echo ">>> [Init] Pod ${target} 已响应"
    done

    # 2) 用纯 Node/mongosh JS 执行幂等初始化、多成员配置与按库最小权限建号
    cat <<'EOF' > /tmp/k8s-init.js
    const env = process.env;
    const RESERVED = new Set(['admin', 'local', 'config']);
    const ALNUM_RE = /^[A-Za-z0-9]+$/;
    const DB_RE = /^[A-Za-z0-9_-]+$/;

    function fail(msg) {
      print(`错误: ${msg}`);
      quit(1);
    }

    function checkAlnum(val, label) {
      if (!val || !ALNUM_RE.test(val) || val === 'CHANGE_ME') {
        fail(`${label} 必须为非空字母数字字符串, 且不能为 CHANGE_ME`);
      }
      return val;
    }

    function checkDbName(val, label) {
      if (!val || val.length > 63 || !DB_RE.test(val)) {
        fail(`${label} 非法 (仅允许字母、数字、下划线与连字符, 长度 1-63)`);
      }
      if (RESERVED.has(val)) {
        fail(`${label} 不能使用保留系统库名 (${val})`);
      }
      return val;
    }

    function parseAndValidateInitConfig(envObj) {
      const rootUser = checkAlnum(envObj.MONGO_INITDB_ROOT_USERNAME, 'MONGO_INITDB_ROOT_USERNAME');
      const rootPwd = checkAlnum(envObj.MONGO_INITDB_ROOT_PASSWORD, 'MONGO_INITDB_ROOT_PASSWORD');
      const appDb = checkDbName((envObj.MONGO_APP_DATABASE || '').trim(), 'MONGO_APP_DATABASE');
      const appUser = checkAlnum(envObj.MONGO_APP_USER, 'MONGO_APP_USER');
      const appPwd = checkAlnum(envObj.MONGO_APP_PASSWORD, 'MONGO_APP_PASSWORD');
      const backupUser = checkAlnum(envObj.MONGO_BACKUP_USER || 'backup', 'MONGO_BACKUP_USER');
      const backupPwd = checkAlnum(envObj.MONGO_BACKUP_PASSWORD, 'MONGO_BACKUP_PASSWORD');

      const apps = [{ db: appDb, user: appUser, pwd: appPwd }];
      const seenDbs = new Set([appDb]);
      const extra = envObj.MONGO_EXTRA_APPS || '';
      let entryIdx = 0;
      for (const raw of extra.split(',')) {
        const item = raw.trim();
        if (!item) continue;
        entryIdx += 1;
        const parts = item.split(':');
        if (parts.length !== 3) {
          fail(`MONGO_EXTRA_APPS 第 ${entryIdx} 项格式非法 (须为 库名:用户名:密码, 且均不含冒号)`);
        }
        const extraDb = checkDbName(parts[0], `MONGO_EXTRA_APPS 第 ${entryIdx} 项库名`);
        if (seenDbs.has(extraDb)) {
          fail(`MONGO_EXTRA_APPS 第 ${entryIdx} 项存在重复业务库名: ${extraDb}`);
        }
        seenDbs.add(extraDb);
        const extraUser = checkAlnum(parts[1], `MONGO_EXTRA_APPS 第 ${entryIdx} 项 (${extraDb}) 用户名`);
        const extraPwd = checkAlnum(parts[2], `MONGO_EXTRA_APPS 第 ${entryIdx} 项 (${extraDb}) 密码`);
        apps.push({ db: extraDb, user: extraUser, pwd: extraPwd });
      }
      return { rootUser, rootPwd, backupUser, backupPwd, apps };
    }

    const initCfg = parseAndValidateInitConfig(env);
    const count = Number(env.MONGO_REPLICA_COUNT || '1');
    const prefix = env.MONGO_POD_PREFIX;
    const svc = env.MONGO_HEADLESS_SVC;
    const ns = env.MONGO_NAMESPACE;
    const port = env.MONGO_PORT || '27117';
    const rsName = env.MONGO_RS_NAME || 'rs0';

    const fqdn = (i) => `${prefix}-${i}.${svc}.${ns}.svc.cluster.local:${port}`;
    const members = [];
    for (let i = 0; i < count; i += 1) {
      members.push(
        count > 1
          ? { _id: i, host: fqdn(i), priority: i === 0 ? 2 : 1 }
          : { _id: 0, host: fqdn(0) }
      );
    }

    const rootCreds = `${encodeURIComponent(initCfg.rootUser)}:${encodeURIComponent(initCfg.rootPwd)}`;
    const uri = `mongodb://${rootCreds}@${fqdn(0)}/admin?authSource=admin&directConnection=true`;
    const admin = new Mongo(uri).getDB('admin');

    let needInit = false;
    try {
      admin.adminCommand({ replSetGetStatus: 1 });
      print('副本集已初始化, 跳过');
    } catch (e) {
      if (e.codeName === 'NotYetInitialized') {
        needInit = true;
      } else {
        throw e;
      }
    }

    if (needInit) {
      print(`初始化副本集 ${rsName}, 成员数: ${members.length}`);
      printjson(admin.adminCommand({ replSetInitiate: { _id: rsName, members } }));
    }

    let primaryUri = uri;
    let ready = false;
    for (let i = 0; i < 60; i += 1) {
      try {
        const h = admin.hello();
        if (h.isWritablePrimary) {
          ready = true;
          break;
        }
        if (h.primary) {
          const candUri = `mongodb://${rootCreds}@${h.primary}/admin?authSource=admin&directConnection=true`;
          if (new Mongo(candUri).getDB('admin').hello().isWritablePrimary) {
            primaryUri = candUri;
            ready = true;
            break;
          }
        }
      } catch (e) {}
      sleep(1000);
    }
    if (!ready) {
      fail('等待 PRIMARY 超时');
    }

    const conn = new Mongo(primaryUri);
    function upsertUser(dbName, user, pwd, roles) {
      const target = conn.getDB(dbName);
      if (target.getUser(user)) {
        target.updateUser(user, { pwd, roles });
        print(`用户 ${user}@${dbName} 已更新`);
      } else {
        target.createUser({ user, pwd, roles });
        print(`用户 ${user}@${dbName} 已创建`);
      }
    }

    for (const a of initCfg.apps) {
      upsertUser(a.db, a.user, a.pwd, [{ role: 'readWrite', db: a.db }]);
    }
    upsertUser('admin', initCfg.backupUser, initCfg.backupPwd, [{ role: 'backup', db: 'admin' }]);
    print('Kubernetes MongoDB 初始化完成');
    EOF

    MONGOSH_NO_TERMINAL_USAGE=1 mongosh --nodb --quiet --file /tmp/k8s-init.js
    rm -f /tmp/k8s-init.js
