{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongo.fullname" . }}-auth
type: Opaque
data:
  root-password: {{ default (randAlphaNum 24) .Values.auth.rootPassword | b64enc | quote }}
  mongodb-keyfile: {{ default (randAlphaNum 756) .Values.auth.keyFileContent | b64enc | quote }}
  app-password: {{ default (randAlphaNum 24) .Values.app.password | b64enc | quote }}
  backup-password: {{ default (randAlphaNum 24) .Values.auth.backupPassword | b64enc | quote }}
  extra-apps: {{ default "" .Values.app.extraApps | b64enc | quote }}
{{- end }}
