{{- if not .Values.auth.existingSecret }}
{{- $secretName := printf "%s-auth" (include "mongo.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if and $existing $existing.data -}}
{{- $existingData = $existing.data -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
type: Opaque
data:
  root-password: {{ if .Values.auth.rootPassword }}{{ .Values.auth.rootPassword | b64enc | quote }}{{ else if hasKey $existingData "root-password" }}{{ index $existingData "root-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  mongodb-keyfile: {{ if .Values.auth.keyFileContent }}{{ .Values.auth.keyFileContent | b64enc | quote }}{{ else if hasKey $existingData "mongodb-keyfile" }}{{ index $existingData "mongodb-keyfile" | quote }}{{ else }}{{ randAlphaNum 756 | b64enc | quote }}{{ end }}
  app-password: {{ if .Values.app.password }}{{ .Values.app.password | b64enc | quote }}{{ else if hasKey $existingData "app-password" }}{{ index $existingData "app-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  backup-password: {{ if .Values.auth.backupPassword }}{{ .Values.auth.backupPassword | b64enc | quote }}{{ else if hasKey $existingData "backup-password" }}{{ index $existingData "backup-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  extra-apps: {{ if .Values.app.extraApps }}{{ .Values.app.extraApps | b64enc | quote }}{{ else if hasKey $existingData "extra-apps" }}{{ index $existingData "extra-apps" | quote }}{{ else }}{{ "" | b64enc | quote }}{{ end }}
{{- end }}
