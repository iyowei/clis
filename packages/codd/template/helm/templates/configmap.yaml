apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" (include "mongo.fullname" .) | quote }}
data:
  mongod.conf: |
    # MongoDB K8S 高性能配置
    systemLog:
      # 不指定 destination: file, 默认输出到 stdout
      verbosity: {{ .Values.config.systemLog.verbosity }}
    storage:
      dbPath: "/data/db"
      wiredTiger:
        collectionConfig:
          blockCompressor: {{ default "zstd" .Values.config.storage.wiredTiger.collectionConfig.blockCompressor | quote }}
        engineConfig:
          cacheSizeGB: {{ .Values.config.storage.wiredTiger.engineConfig.cacheSizeGB }}
          journalCompressor: {{ default "snappy" (dig "engineConfig" "journalCompressor" "snappy" .Values.config.storage.wiredTiger) | quote }}
        indexConfig:
          prefixCompression: {{ if hasKey (default dict .Values.config.storage.wiredTiger.indexConfig) "prefixCompression" }}{{ .Values.config.storage.wiredTiger.indexConfig.prefixCompression }}{{ else }}true{{ end }}
    net:
      port: {{ .Values.config.net.port }}
      bindIpAll: {{ .Values.config.net.bindIpAll }}
      ipv6: false
      maxIncomingConnections: {{ default 100 .Values.config.net.maxIncomingConnections }}
      compression:
        compressors: {{ default "snappy,zstd,zlib" (dig "compression" "compressors" "snappy,zstd,zlib" .Values.config.net) | quote }}
    security:
      authorization: {{ .Values.config.security.authorization | quote }}
      keyFile: {{ .Values.config.security.keyFile | quote }}
    replication:
      replSetName: {{ .Values.config.replication.replSetName | quote }}
      oplogSizeMB: {{ .Values.config.replication.oplogSizeMB }}
    operationProfiling:
      mode: {{ .Values.config.operationProfiling.mode | quote }}
      slowOpThresholdMs: {{ .Values.config.operationProfiling.slowOpThresholdMs }}
