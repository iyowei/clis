# 包级 bun 配置: 在包目录裸跑 `bun test` (反射式命令) 时, 测试发现面不得捡走 assets 下的
# 模板资产: 它是生成器按骨架清单产出的「新项目根」, 内含从本仓复制过去的 *.test.ts, 不是
# 本包的测试 (同款排除见 .gitignore / .prettierignore / .oxlintrc.json 与 tsconfig.json)。
# 根 bunfig.toml 的排除面是根相对路径 (packages/create-clis/assets/**), 在包目录内不解析;
# 此处以包相对形态复写同一面; 包内 test 脚本的 --path-ignore-patterns 旗标与此互为兜底。
[test]
pathIgnorePatterns = ["assets/**"]
