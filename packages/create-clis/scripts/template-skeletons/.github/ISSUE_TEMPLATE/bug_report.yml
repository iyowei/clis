name: Bug report
description: Report a problem with {{NAME}} CLI or programmable API.
title: "[Bug]:\x20"
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, do not open a public issue; see [SECURITY.md]({{REPO_URL}}/blob/main/SECURITY.md).
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched the existing issues and did not find this report.
          required: true
        - label: I can reproduce this on the latest version or main branch.
          required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - '{{SCOPE}}/{{NAME}}-cli ({{BIN_NAME}})'
        - '{{SCOPE}}/{{NAME}} (API)'
        - Repository infrastructure / docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: 'bun 1.4.2 / node 24.0.0'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
