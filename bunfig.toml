# bun 配置
# linker = "hoisted" 是让 oxlint / typescript 等 Node CJS 工具链能正确解析
# peer dependency 的关键。若改成 isolated, 这些工具的插件会解析到全局缓存
# 的符号链接路径, 而 peer 依赖落在平行缓存目录, 找不到, 工具链直接报错。
# 仓库级配置默认使用官方 npm registry; 如需国内本机加速, 请在个人 ~/.bunfig.toml 配置镜像源。

[install]
frozenLockfile = false
linker = "hoisted"

# 测试发现面: 排除生成物与模板源码空间, 防其在根级 bun test 中被误跑
# (同款排除见 .gitignore / .prettierignore / .oxlintrc.json 与 tsconfig.json)。
[test]
pathIgnorePatterns = [
  "scripts/transcription/mutants/**",
  "packages/create-clis/assets/**",
  "packages/create-clis/scripts/template-skeletons/**",
  "packages/codd/assets/**",
  "packages/codd/template/**",
  "packages/codd-cli/assets/**",
]
